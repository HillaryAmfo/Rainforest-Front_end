<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header without Dropdowns</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <header class="bg-green-800 text-white relative z-50">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
      <!-- Logo -->
      <div class="flex items-center gap-4">
        <img src="https://via.placeholder.com/100x30?text=ecova" alt="Ecova Logo" class="h-8" />
      </div>

      <!-- Navigation -->
      <nav class="flex-1 ml-10">
        <ul class="flex items-center gap-6 text-sm font-medium">
          <li><a href="/Rainforest-Front_end/index.html" class="hover:text-lime-300">HOME</a></li>
          <li><span class="border-l border-white/40 h-4"></span></li>

          <li><a href="/Rainforest-Front_end/pages/about.html" class="hover:text-lime-300">ABOUT</a></li>
          <li><span class="border-l border-white/40 h-4"></span></li>

          <li><a href="/Rainforest-Front_end/pages/events.html" class="hover:text-lime-300">EVENTS</a></li>
          <li><span class="border-l border-white/40 h-4"></span></li>

          <li><a href="/Rainforest-Front_end/pages/projects.html" class="hover:text-lime-300">CAUSES</a></li>
          <li><span class="border-l border-white/40 h-4"></span></li>

          <li><a href="/Rainforest-Front_end/pages/blog.html" class="hover:text-lime-300">BLOGS</a></li>
          <li><span class="border-l border-white/40 h-4"></span></li>

          <li><a href="/Rainforest-Front_end/pages/services.html" class="hover:text-lime-300">PAGES</a></li>
          <li><span class="border-l border-white/40 h-4"></span></li>

          <li><a href="/Rainforest-Front_end/pages/contact.html" class="hover:text-lime-300">CONTACT</a></li>
        </ul>
      </nav>

      <!-- Right Actions -->
      <div class="flex items-center gap-4">
        <a href="/Rainforest-Front_end/pages/donate.html" class="bg-green-400 hover:bg-green-500 text-white px-4 py-2 rounded font-semibold text-sm">MAKE A DONATION</a>

        <button class="w-8 h-8 rounded-full border border-white flex items-center justify-center hover:bg-white hover:text-green-800">🔍</button>
        <button class="w-8 h-8 rounded-full border border-white flex items-center justify-center hover:bg-white hover:text-green-800">🛒</button>

        <div class="text-sm">
          <a href="/Rainforest-Front_end/pages/register.html#login" class="hover:underline">Login</a> |
          <a href="/Rainforest-Front_end/pages/register.html#register" class="hover:underline">Signup</a>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
