<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoHealth Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Ensure body and html take full height and remove default margins */
        body,
        html {
            height: 100%;
            margin: 0;
        }

        /* Apply Nunito Sans font to the entire body */
        body {
            font-family: 'Nunito Sans', sans-serif;
        }

        /* Optional: Custom background pattern example (uncomment and define if needed)
        .bg-leaf-pattern {
            background-image: url('path/to/subtle-leaf-pattern.png');
            background-repeat: repeat;
            background-size: 50px;
        }
        */
    </style>
</head>

<body class="h-screen w-screen bg-green-100 flex items-center justify-center p-4">
    <div class="relative w-full h-full max-h-[800px] overflow-hidden bg-white grid grid-cols-1 md:grid-cols-12 shadow-2xl rounded-xl max-w-6xl">
        <div class="col-span-1 md:col-span-7 relative h-64 md:h-full flex items-center justify-center">
            <a href="/" class="absolute top-4 left-6 z-10 flex items-center gap-2 text-green-800 text-2xl font-bold hover:opacity-90 hover:scale-105 transition-all">
                <img src="https://www.svgrepo.com/show/308779/leaf.svg" alt="EcoHealth Logo" class="w-10 h-10 fill-current text-green-700">
                <span>EcoHealth</span>
            </a>

            <div id="authImage" class="w-full h-full bg-cover bg-center transition-all duration-500"
                style="background-image: url('https://images.unsplash.com/photo-1498804103079-a6351b050096?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');">
                <div class="w-full h-full bg-black bg-opacity-30 flex items-center justify-center p-4">
                    <span id="authText" class="text-white text-3xl md:text-4xl font-semibold text-center leading-tight">Embrace a Healthier Path!</span>
                </div>
            </div>
        </div>

        <div class="col-span-1 md:col-span-5 relative overflow-hidden bg-white">
            <div id="formContainer" class="flex w-[200%] h-full transition-transform duration-500">

                <div id="login" class="w-1/2 p-8 md:p-10 flex flex-col justify-center min-h-full">
                    <h2 class="text-3xl font-bold mb-6 text-green-700 text-center">Welcome Back</h2>
                    <form id="loginForm" class="space-y-4">
                        <input type="email" id="loginEmail" placeholder="Email" class="w-full border border-green-300 rounded-md px-4 py-2 focus:ring-green-500 focus:border-green-500 outline-none transition-colors" required>
                        <input type="password" id="loginPassword" placeholder="Password" class="w-full border border-green-300 rounded-md px-4 py-2 focus:ring-green-500 focus:border-green-500 outline-none transition-colors" required>
                        <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600 focus:ring-2 focus:ring-green-500 focus:ring-offset-1 transition-colors">Login</button>
                    </form>

                    <div class="flex items-center my-6">
                        <div class="flex-grow h-px bg-gray-300"></div>
                        <span class="px-4 text-gray-500 text-sm">OR</span>
                        <div class="flex-grow h-px bg-gray-300"></div>
                    </div>

                    <div class="space-y-3">
                        <button class="w-full flex items-center justify-center gap-3 border border-green-300 py-2 rounded-md hover:bg-green-50 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                            <span>Continue with Google</span>
                        </button>
                        <button class="w-full flex items-center justify-center gap-3 border border-green-300 py-2 rounded-md hover:bg-green-50 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1">
                            <img src="https://www.svgrepo.com/show/303128/apple-logo.svg" alt="Apple" class="w-5 h-5">
                            <span>Continue with Apple</span>
                        </button>
                        <button class="w-full flex items-center justify-center gap-3 border border-green-300 py-2 rounded-md hover:bg-green-50 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1">
                            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="w-5 h-5">
                            <span>Continue with Facebook</span>
                        </button>
                    </div>

                    <p class="mt-6 text-sm text-gray-600 text-center">Don't have an account?
                        <button onclick="showSignUp()" class="text-green-500 hover:underline focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1 font-medium">Sign up</button>
                    </p>
                </div>

                <div id="register" class="w-1/2 p-8 md:p-10 flex flex-col justify-center min-h-full bg-green-50">
                    <h2 class="text-3xl font-bold mb-6 text-green-700 text-center">Create Account</h2>
                    <form id="signUpForm" class="space-y-4">
                        <input type="text" id="fullName" placeholder="Full Name" class="w-full border border-green-300 rounded-md px-4 py-2 focus:ring-green-500 focus:border-green-500 outline-none transition-colors" required>
                        <input type="email" id="signUpEmail" placeholder="Email" class="w-full border border-green-300 rounded-md px-4 py-2 focus:ring-green-500 focus:border-green-500 outline-none transition-colors" required>
                        <input type="password" id="signUpPassword" placeholder="Password" class="w-full border border-green-300 rounded-md px-4 py-2 focus:ring-green-500 focus:border-green-500 outline-none transition-colors" required>
                        <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600 focus:ring-2 focus:ring-green-500 focus:ring-offset-1 transition-colors">Sign Up</button>
                    </form>

                    <div class="flex items-center my-6">
                        <div class="flex-grow h-px bg-gray-300"></div>
                        <span class="px-4 text-gray-500 text-sm">OR</span>
                        <div class="flex-grow h-px bg-gray-300"></div>
                    </div>

                    <div class="space-y-3">
                        <button class="w-full flex items-center justify-center gap-3 border border-green-300 py-2 rounded-md hover:bg-green-100 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                            <span>Continue with Google</span>
                        </button>
                        <button class="w-full flex items-center justify-center gap-3 border border-green-300 py-2 rounded-md hover:bg-green-100 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1">
                            <img src="https://www.svgrepo.com/show/303128/apple-logo.svg" alt="Apple" class="w-5 h-5">
                            <span>Continue with Apple</span>
                        </button>
                        <button class="w-full flex items-center justify-center gap-3 border border-green-300 py-2 rounded-md hover:bg-green-100 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1">
                            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="w-5 h-5">
                            <span>Continue with Facebook</span>
                        </button>
                    </div>

                    <p class="mt-6 text-sm text-gray-600 text-center">Already have an account?
                        <button onclick="showLogin()" class="text-green-500 hover:underline focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-1 font-medium">Login</button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get references to DOM elements
        const formContainer = document.getElementById('formContainer');
        const authImage = document.getElementById('authImage');
        const authText = document.getElementById('authText');

        /**
         * Function to show the Sign Up form and update the background image/text.
         */
        function showSignUp() {
            formContainer.style.transform = 'translateX(-50%)'; // Slide form container left
            // Update background image for signup
            authImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1551802234-914f914b6ba8?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')";
            authText.textContent = 'Embrace Growth!'; // Update text
            // Optional: Dynamic body background change (uncomment if you define .bg-leaf-pattern)
            // document.body.classList.remove('bg-green-100');
            // document.body.classList.add('bg-leaf-pattern'); 
        }

        /**
         * Function to show the Login form and update the background image/text.
         */
        function showLogin() {
            formContainer.style.transform = 'translateX(0)'; // Slide form container right (back to original position)
            // Update background image for login
            authImage.style.backgroundImage = "url('https://images.unsplash.com/photo-1519389950473-47e705ed8dad?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')";
            authText.textContent = 'Welcome Back to Nature!'; // Update text
            // Optional: Dynamic body background change
            // document.body.classList.remove('bg-leaf-pattern');
            // document.body.classList.add('bg-green-100');
        }

        /**
         * Event listener for the Login form submission.
         * Prevents default form submission and handles API call.
         */
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Prevent default form submission
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                // Using alert for simplicity, consider a custom modal for better UX
                alert("Please fill in both fields.");
                return;
            }

            try {
                // API call to reqres.in for login simulation
                const response = await fetch("https://reqres.in/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("Login success", data);
                    // Redirect to dashboard on successful login
                    window.location.href = "/project_ken/my-frontend-project/pages/dashboard.html";
                } else {
                    const error = await response.json();
                    // Using alert for simplicity, consider a custom modal for better UX
                    alert("Login failed: " + error.error);
                }
            } catch (err) {
                // Handle network errors
                alert("Network error. Please try again.");
            }
        });

        /**
         * Event listener for the Sign Up form submission.
         * Prevents default form submission and handles API call.
         */
        document.getElementById('signUpForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Prevent default form submission
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('signUpEmail').value.trim();
            const password = document.getElementById('signUpPassword').value.trim();

            if (!fullName || !email || !password) {
                // Using alert for simplicity, consider a custom modal for better UX
                alert("Please fill in all fields to sign up.");
                return;
            }

            try {
                // API call to reqres.in for register simulation
                const response = await fetch("https://reqres.in/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("Sign up success", data);
                    // Redirect to dashboard on successful signup
                    window.location.href = "/project_ken/my-frontend-project/pages/dashboard.html";
                } else {
                    const error = await response.json();
                    // Using alert for simplicity, consider a custom modal for better UX
                    alert("Sign up failed: " + error.error);
                }
            } catch (err) {
                // Handle network errors
                alert("Network error. Please try again.");
            }
        });
    </script>
</body>

</html>
